name: Deploy to prod

on:
  push:
    branches: [main]
  # When a Kira PR is auto-merged, GitHub Actions intentionally does NOT
  # cascade push-triggered workflows fired via GITHUB_TOKEN (anti-loop).
  # Hook into the auto-merge workflow's completion so the prod deploy still
  # runs on those merges. The job below filters to successful runs on main.
  workflow_run:
    workflows: ["Kira PR auto-merge"]
    types: [completed]
  workflow_dispatch: {}

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: rsync + restart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deploy triggers:
    #   - direct push to main (CD)
    #   - workflow_dispatch (manual)
    #   - auto-merge run that actually merged a PR into main
    #
    # The `Kira PR auto-merge` workflow returns success even when it merges
    # nothing (skip branches just `continue`). That used to fire a deploy
    # for every Kira PR open/synchronize — which restarted webchat in the
    # middle of agent sessions (drills 4/5). The `Ensure head SHA on main`
    # step below guards against that by checking that workflow_run.head_sha
    # is actually present on origin/main before doing anything.
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    # Gate on the test job in ci.yml: deploy only runs if CI is green for the
    # same SHA. workflow_run would be cleaner, but push-triggered deploys with
    # a needs-style guard via gh API is overkill. Keep it simple: if you push
    # red code, this still deploys -- run smoke locally before pushing.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Decide whether to deploy
        id: gate
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "reason=event=${{ github.event_name }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # workflow_run path: the auto-merge workflow finishes green even
          # when it merges nothing (it just `continue`s past ineligible PRs).
          # That used to fire a deploy for every Kira PR opened/synchronize
          # and restarted webchat mid-session (see drills 4 & 5). Guard by
          # checking the head SHA is actually reachable from origin/main.
          sha='${{ github.event.workflow_run.head_sha }}'
          if git merge-base --is-ancestor "$sha" origin/main; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "reason=sha $sha is on main" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "reason=sha $sha not on main; auto-merge did not land" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy: auto-merge run completed without merging."
          fi

      - name: Set up SSH
        if: steps.gate.outputs.should_deploy == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::PROD_SSH_KEY secret is not set. See .github/workflows/deploy.yml"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.PROD_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync source to prod
        if: steps.gate.outputs.should_deploy == 'true'
        env:
          HOST: ${{ secrets.PROD_HOST }}
          USER: ${{ secrets.PROD_USER }}
        run: |
          # NOTE: we DO sync .git so the agent's git_commit tool works
          # against /home/exedev/webchat. Side-effect: --delete will overwrite
          # any agent-side local commits on next deploy. Push from prod or via
          # /tmp/kira-fix if you want to keep them.
          rsync -az --delete \
            --exclude '.venv/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            --exclude '.pytest_cache/' \
            --exclude '.ruff_cache/' \
            --exclude 'agent_sessions.db*' \
            --exclude 'sandbox/agent_sessions.db*' \
            --exclude 'sandbox/*.bak*' \
            --exclude 'workspaces/' \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no" \
            ./ "$USER@$HOST:webchat/"

      - name: Restart services
        if: steps.gate.outputs.should_deploy == 'true'
        env:
          HOST: ${{ secrets.PROD_HOST }}
          USER: ${{ secrets.PROD_USER }}
        run: |
          # webchat = main app. kira-tg-bot = Telegram frontend (ops/tg_bot.py).
          # kira-tg-bot restart is best-effort: a missing unit shouldn't fail
          # the deploy on environments that don't run the bot.
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no "$USER@$HOST" \
            'set -e
             sudo systemctl restart webchat
             sleep 3
             systemctl is-active webchat
             if systemctl list-unit-files | grep -q "^kira-tg-bot.service"; then
               sudo systemctl restart kira-tg-bot || true
             fi'

      - name: Smoke test (via SSH → localhost)
        if: steps.gate.outputs.should_deploy == 'true'
        env:
          HOST: ${{ secrets.PROD_HOST }}
          USER: ${{ secrets.PROD_USER }}
          KIRA_AUTH_TOKEN: ${{ secrets.KIRA_AUTH_TOKEN }}
        run: |
          # Public URL is behind exe.dev OAuth proxy, so smoke from GH runner
          # would 503. We curl localhost:3000 over SSH instead.
          set -e
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no "$USER@$HOST" \
            "curl -fsS http://localhost:3000/healthz && \
             curl -fsS -H 'Authorization: Bearer $KIRA_AUTH_TOKEN' \
               http://localhost:3000/agent/health | head -c 500"
          echo
          echo "Deploy OK"

      - name: Notify on failure (Telegram)
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            curl -fsS "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
              -d chat_id="$TG_CHAT" \
              -d text="❌ Kira deploy failed for ${GITHUB_SHA::7} (${GITHUB_REF_NAME})" || true
          fi
