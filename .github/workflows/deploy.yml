name: Deploy to prod

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: rsync + restart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Gate on the test job in ci.yml: deploy only runs if CI is green for the
    # same SHA. workflow_run would be cleaner, but push-triggered deploys with
    # a needs-style guard via gh API is overkill. Keep it simple: if you push
    # red code, this still deploys -- run smoke locally before pushing.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up SSH
        env:
          DEPLOY_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::PROD_SSH_KEY secret is not set. See .github/workflows/deploy.yml"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.PROD_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync source to prod
        env:
          HOST: ${{ secrets.PROD_HOST }}
          USER: ${{ secrets.PROD_USER }}
        run: |
          # NOTE: we DO sync .git so the agent's git_commit tool works
          # against /home/exedev/webchat. Side-effect: --delete will overwrite
          # any agent-side local commits on next deploy. Push from prod or via
          # /tmp/kira-fix if you want to keep them.
          rsync -az --delete \
            --exclude '.venv/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            --exclude '.pytest_cache/' \
            --exclude '.ruff_cache/' \
            --exclude 'agent_sessions.db*' \
            --exclude 'sandbox/' \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no" \
            ./ "$USER@$HOST:webchat/"

      - name: Restart services
        env:
          HOST: ${{ secrets.PROD_HOST }}
          USER: ${{ secrets.PROD_USER }}
        run: |
          # webchat = main app. kira-tg-bot = Telegram frontend (ops/tg_bot.py).
          # kira-tg-bot restart is best-effort: a missing unit shouldn't fail
          # the deploy on environments that don't run the bot.
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no "$USER@$HOST" \
            'set -e
             sudo systemctl restart webchat
             sleep 3
             systemctl is-active webchat
             if systemctl list-unit-files | grep -q "^kira-tg-bot.service"; then
               sudo systemctl restart kira-tg-bot || true
             fi'

      - name: Smoke test (via SSH → localhost)
        env:
          HOST: ${{ secrets.PROD_HOST }}
          USER: ${{ secrets.PROD_USER }}
          KIRA_AUTH_TOKEN: ${{ secrets.KIRA_AUTH_TOKEN }}
        run: |
          # Public URL is behind exe.dev OAuth proxy, so smoke from GH runner
          # would 503. We curl localhost:3000 over SSH instead.
          set -e
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no "$USER@$HOST" \
            "curl -fsS http://localhost:3000/healthz && \
             curl -fsS -H 'Authorization: Bearer $KIRA_AUTH_TOKEN' \
               http://localhost:3000/agent/health | head -c 500"
          echo
          echo "Deploy OK"

      - name: Notify on failure (Telegram)
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            curl -fsS "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
              -d chat_id="$TG_CHAT" \
              -d text="❌ Kira deploy failed for ${GITHUB_SHA::7} (${GITHUB_REF_NAME})" || true
          fi
