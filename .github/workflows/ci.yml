name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system deps (ripgrep, best-effort)
        # Don't block CI if apt is slow / mirror flaky — the affected tests
        # are decorated with skipif(not which('rg')) so they just skip.
        continue-on-error: true
        timeout-minutes: 2
        run: |
          sudo apt-get install -y --no-install-recommends ripgrep || true

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov coverage

      - name: Show versions
        run: |
          python --version
          pip list | head -40

      - name: Run pytest with coverage
        env:
          KIRA_SANDBOX: "0"
          KIRO_API_KEY: "ksk_ci_fake"
        run: |
          pytest tests/ -q --tb=short \
            --cov=. --cov-report=term --cov-report=xml:coverage.xml --cov-report=json:coverage.json

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.json
            coverage.xml
          retention-days: 14

      - name: Compile-check all .py
        run: |
          python -m compileall -q .

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.7.4
      - name: Ruff check
        # Non-blocking for now — surface warnings without failing the build.
        # Drop `|| true` once the codebase is clean.
        run: ruff check . || true
