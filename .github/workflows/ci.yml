name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show versions
        run: |
          python --version
          pip list | head -40

      - name: Run pytest
        env:
          KIRA_SANDBOX: "0"
          KIRO_API_KEY: "ksk_ci_fake"
        run: |
          pytest tests/ -q --tb=short

      - name: Compile-check all .py
        run: |
          python -m compileall -q .

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.7.4
      - name: Ruff check
        # Non-blocking for now — surface warnings without failing the build.
        # Drop `|| true` once the codebase is clean.
        run: ruff check . || true
